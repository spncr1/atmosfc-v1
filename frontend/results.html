<!-- Search results page (for match) -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos FC - Search Results</title>

    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/results.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  </head>
  
  <body class="results-page">
    <header>
      <a class="brand" href="index.html"><- Back</a>
    </header>

    <main class="content">
      <section class="hero">
        <div class="hero-top">
          <div class="hero-copy">
            <h2>Search Results</h2>
            <p>Filter by competition and season, then pick a match to analyse YouTube fans' post-match reaction.</p>
          </div>

          <img class="hero-logo" src="assets/atmosfc-logo-v2.svg" alt="Atmos FC">
        </div>
      </section>

      <form class="filter-panel search-form" data-filter-form>
        <div class="search-bar search-bar--compact">
          <label class="search-label">
            Search
            <input class="search-input" name="q" type="search" placeholder="PSG, Barcelona, Man United vs Man City">
          </label>
        </div>

        <div class="filter-row">
          <label class="search-label">
            Competition
	            <select name="competition" data-competition-select>
	              <option value="">All</option>
	            </select>
	          </label>
	          <label class="search-label">
	            Season
	            <select name="season" data-season-select>
	              <option value="">All seasons</option>
	            </select>
	          </label>
          <button class="primary-button" type="submit">Apply</button>
        </div>
      </form>

      <section class="results-summary" data-results-summary></section>
      <section class="match-list" data-results></section>
      <nav class="pagination" data-pagination aria-label="Search results pages"></nav>
    </main>

    <script src="js/config.js?v=20260605-local-api-score-context"></script>
    <script src="js/api.js?v=20260605-local-api-score-context"></script>
    <script src="js/results.js?v=20260605-local-api-score-context"></script>
  </body>
</html>
