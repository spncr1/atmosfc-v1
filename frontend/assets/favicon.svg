<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img">
  <title>Atmos FC</title>
  <!-- transparent background -->

  <!-- Ghost crowd back row -->
  <g opacity="0.25" fill="#C8FF47">
    <circle cx="1"  cy="28" r="1.5"/><rect x="0"  y="29.5" width="3" height="2.5" rx="0.8"/>
    <circle cx="5"  cy="27" r="1.5"/><rect x="4"  y="28.5" width="3" height="2.5" rx="0.8"/>
    <circle cx="9"  cy="28" r="1.5"/><rect x="8"  y="29.5" width="3" height="2.5" rx="0.8"/>
    <circle cx="13" cy="26" r="1.5"/><rect x="12" y="27.5" width="3" height="2.5" rx="0.8"/>
    <circle cx="17" cy="27" r="1.5"/><rect x="16" y="28.5" width="3" height="2.5" rx="0.8"/>
    <circle cx="21" cy="26" r="1.5"/><rect x="20" y="27.5" width="3" height="2.5" rx="0.8"/>
    <circle cx="25" cy="27" r="1.5"/><rect x="24" y="28.5" width="3" height="2.5" rx="0.8"/>
    <circle cx="29" cy="26" r="1.5"/><rect x="28" y="27.5" width="3" height="2.5" rx="0.8"/>
    <!-- front row -->
    <circle cx="1"  cy="20" r="1.4"/><rect x="0"  y="21.4" width="3" height="2.2" rx="0.8"/>
    <circle cx="5"  cy="18" r="1.4"/><rect x="4"  y="19.4" width="3" height="2.2" rx="0.8"/>
    <circle cx="9"  cy="16" r="1.5"/><rect x="8"  y="17.5" width="3" height="2.2" rx="0.8"/>
    <circle cx="13" cy="13" r="1.5"/><rect x="12" y="14.5" width="3" height="2.2" rx="0.8"/>
    <circle cx="17" cy="14" r="1.5"/><rect x="16" y="15.5" width="3" height="2.2" rx="0.8"/>
    <circle cx="21" cy="11" r="1.7"/><rect x="20" y="12.7" width="3.4" height="2.2" rx="0.8"/>
    <circle cx="25" cy="13" r="1.5"/><rect x="24" y="14.5" width="3" height="2.2" rx="0.8"/>
    <circle cx="29" cy="15" r="1.4"/><rect x="28" y="16.4" width="3" height="2.2" rx="0.8"/>
  </g>

  <!-- Pulse line -->
  <polyline
    points="0,20 4,20 8,13 12,24 16,7 20,15 24,4 28,14 32,18"
    fill="none"
    stroke="#C8FF47"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Peak dot -->
  <circle cx="24" cy="4" r="2.5" fill="#C8FF47"/>
  <circle cx="24" cy="4" r="4.5" fill="none" stroke="#C8FF47" stroke-width="0.8" opacity="0.35"/>

  <!-- Low dot -->
  <circle cx="12" cy="24" r="1.8" fill="#505058"/>
</svg>
