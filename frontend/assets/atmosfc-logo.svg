<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">

  <defs>
    <clipPath id="crowd-clip">
      <rect x="0" y="0" width="172" height="90"/>
    </clipPath>
  </defs>

  <!-- Background transparent -->

  <!-- Ghost crowd — back row -->
  <g clip-path="url(#crowd-clip)" opacity="0.13" fill="#C8FF47">
    <circle cx="10"  cy="70" r="6"/><rect x="4"   y="76" width="12" height="10" rx="3"/>
    <circle cx="26"  cy="68" r="6"/><rect x="20"  y="74" width="12" height="10" rx="3"/>
    <circle cx="42"  cy="70" r="6"/><rect x="36"  y="76" width="12" height="10" rx="3"/>
    <circle cx="58"  cy="67" r="6"/><rect x="52"  y="73" width="12" height="10" rx="3"/>
    <circle cx="74"  cy="69" r="6"/><rect x="68"  y="75" width="12" height="10" rx="3"/>
    <circle cx="90"  cy="66" r="6"/><rect x="84"  y="72" width="12" height="10" rx="3"/>
    <circle cx="106" cy="68" r="6"/><rect x="100" y="74" width="12" height="10" rx="3"/>
    <circle cx="122" cy="70" r="6"/><rect x="116" y="76" width="12" height="10" rx="3"/>
    <circle cx="138" cy="67" r="6"/><rect x="132" y="73" width="12" height="10" rx="3"/>
    <circle cx="154" cy="69" r="6"/><rect x="148" y="75" width="12" height="10" rx="3"/>
    <circle cx="170" cy="68" r="6"/><rect x="164" y="74" width="12" height="10" rx="3"/>

    <!-- Ghost crowd — front row -->
    <circle cx="10"  cy="46" r="5.5"/><rect x="4"   y="52" width="12" height="9" rx="3"/>
    <circle cx="26"  cy="42" r="5.5"/><rect x="20"  y="48" width="12" height="9" rx="3"/>
    <circle cx="42"  cy="40" r="6"/>  <rect x="36"  y="46" width="12" height="9" rx="3"/>
    <circle cx="58"  cy="36" r="6"/>  <rect x="52"  y="42" width="12" height="9" rx="3"/>
    <circle cx="74"  cy="38" r="6"/>  <rect x="68"  y="44" width="12" height="9" rx="3"/>
    <circle cx="90"  cy="34" r="6.5"/><rect x="83"  y="41" width="13" height="9" rx="3"/>
    <circle cx="106" cy="36" r="6"/>  <rect x="100" y="42" width="12" height="9" rx="3"/>
    <circle cx="122" cy="40" r="5.5"/><rect x="116" y="46" width="12" height="9" rx="3"/>
    <circle cx="138" cy="44" r="5.5"/><rect x="132" y="50" width="12" height="9" rx="3"/>
    <circle cx="154" cy="42" r="5.5"/><rect x="148" y="48" width="12" height="9" rx="3"/>
    <circle cx="170" cy="46" r="5"/>  <rect x="164" y="52" width="12" height="9" rx="3"/>
  </g>

  <!-- Sentiment pulse line -->
  <polyline
    points="6,56 20,56 34,34 48,64 62,26 78,46 92,14 106,38 120,48 142,48 165,48 171,48"
    fill="none"
    stroke="#C8FF47"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Peak dot + ring -->
  <circle cx="92" cy="14" r="5" fill="#C8FF47"/>
  <circle cx="92" cy="14" r="9" fill="none" stroke="#C8FF47" stroke-width="1" opacity="0.3"/>

  <!-- Low point dot -->
  <circle cx="48" cy="64" r="3" fill="#505058"/>

  <!-- Wordmark -->
  <text
    x="184"
    y="45"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="30"
    font-weight="500"
    fill="#FFFFFF"
    letter-spacing="-1"
  >atmos fc</text>

  <!-- Tagline -->
  <text
    x="184"
    y="63"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="11"
    font-weight="400"
    fill="#A0A0AA"
    letter-spacing="1"
  >MATCH SENTIMENT TRACKER</text>

</svg>
