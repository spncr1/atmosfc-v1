<!-- Landing + search page -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos FC</title>

    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg" href="/atmosfc-logo.svg">
  </head>
  <body class="home-page">

    <main class="content">
      <section class="hero">
        <div class="hero-top">
          <div class="hero-copy">
            <h1>Atmos FC</h1>
            <h2>Search any match. See how fans reacted.</h2>
            <p>Track fan sentiment from YouTube comments in the 24 hours after the final whistle.</p>
          </div>
          
          <!-- Atmos FC logo -->
          <svg class="hero-logo" width="260" height="48" viewBox="0 -4 260 48" role="img">
            <title>Atmos FC logo</title>
            <defs><clipPath id="cc"><rect x="0" y="0" width="82" height="44"/></clipPath></defs>
            <g clip-path="url(#cc)" opacity="0.13" fill="#C8FF47">
              <circle cx="5" cy="34" r="3"/><rect x="2" y="37" width="6" height="5" rx="1.5"/>
              <circle cx="13" cy="32" r="3"/><rect x="10" y="35" width="6" height="5" rx="1.5"/>
              <circle cx="21" cy="34" r="3"/><rect x="18" y="37" width="6" height="5" rx="1.5"/>
              <circle cx="29" cy="31" r="3"/><rect x="26" y="34" width="6" height="5" rx="1.5"/>
              <circle cx="37" cy="33" r="3"/><rect x="34" y="36" width="6" height="5" rx="1.5"/>
              <circle cx="45" cy="30" r="3"/><rect x="42" y="33" width="6" height="5" rx="1.5"/>
              <circle cx="53" cy="32" r="3"/><rect x="50" y="35" width="6" height="5" rx="1.5"/>
              <circle cx="61" cy="34" r="3"/><rect x="58" y="37" width="6" height="5" rx="1.5"/>
              <circle cx="69" cy="31" r="3"/><rect x="66" y="34" width="6" height="5" rx="1.5"/>
              <circle cx="77" cy="33" r="3"/><rect x="74" y="36" width="6" height="5" rx="1.5"/>
              <circle cx="5" cy="22" r="2.8"/><rect x="2" y="25" width="6" height="4" rx="1.5"/>
              <circle cx="13" cy="20" r="2.8"/><rect x="10" y="23" width="6" height="4" rx="1.5"/>
              <circle cx="21" cy="18" r="3"/><rect x="18" y="21" width="6" height="4" rx="1.5"/>
              <circle cx="29" cy="15" r="3"/><rect x="26" y="18" width="6" height="4" rx="1.5"/>
              <circle cx="37" cy="17" r="3"/><rect x="34" y="20" width="6" height="4" rx="1.5"/>
              <circle cx="45" cy="13" r="3.2"/><rect x="41" y="16" width="7" height="4" rx="1.5"/>
              <circle cx="53" cy="15" r="3"/><rect x="50" y="18" width="6" height="4" rx="1.5"/>
              <circle cx="61" cy="19" r="2.8"/><rect x="58" y="22" width="6" height="4" rx="1.5"/>
              <circle cx="69" cy="21" r="2.8"/><rect x="66" y="24" width="6" height="4" rx="1.5"/>
              <circle cx="77" cy="23" r="2.5"/><rect x="74" y="26" width="6" height="4" rx="1.5"/>
            </g>
            <polyline points="3,27 10,27 17,16 24,31 31,10 39,21 45,5 52,18 59,23 68,23 78,23 82,23" fill="none" stroke="#C8FF47" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="45" cy="5" r="3" fill="#C8FF47"/>
            <circle cx="45" cy="5" r="5.5" fill="none" stroke="#C8FF47" stroke-width="1" opacity="0.3"/>
            <circle cx="24" cy="31" r="2" fill="#505058"/>
            <text x="90" y="22" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#FFFFFF" letter-spacing="-0.5">atmos fc</text>
            <text x="90" y="34" font-family="Inter, -apple-system, sans-serif" font-size="7" font-weight="400" fill="#505058" letter-spacing="0.8">MATCH SENTIMENT TRACKER</text>
          </svg>
        </div>

        <form class="match-search-layout search-section" data-search-form>
          <div class="search-row">
            <label class="section-heading">
              Search by team or competition
              <input name="q" type="search" placeholder="Arsenal, Barcelona, UCL">
            </label>
            <button class="primary-button" type="submit">Search ↗</button>
          </div>

          <fieldset class="filter-section">
            <span class="search-field">Competition:</span>
            <div class="filter-pills">
              <label class="filter-option"><input type="radio" name="competition" value="" checked><span>All</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="PL"><span>PL</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="PD"><span>La Liga</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="BL1"><span>Bundesliga</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="SA"><span>Serie A</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="FL1"><span>Ligue 1</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="CL"><span>UCL</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="EL"><span>UEL</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="EC"><span>UECL</span></label>
            </div>
          </fieldset>

          <fieldset class="filter-section">
            <span class="search-field">Season:</span>
            <div class="filter-pills">
              <label class="filter-option"><input type="radio" name="season" value="2025" checked><span>25/26</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2024"><span>24/25</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2023"><span>23/24</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2022"><span>22/23</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2021"><span>21/22</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2020"><span>20/21</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2019"><span>19/20</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2018"><span>18/19</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2017"><span>17/18</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2016"><span>16/17</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2015"><span>15/16</span></label>
            </div>
          </fieldset>
        </form>
      </section>

      <section class="match-search-layout recent-section">
        <div class="section-head">
          Recent matches
        </div>
        <div class="match-grid" data-recent></div>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
