<!-- Landing + search page -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos FC</title>

    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  </head>
  
  <body class="home-page">
    <main class="content">
      <section class="hero">
        <div class="hero-top">
          <div class="hero-copy">
            <h2>
              Search any match.
              <span>See how fans reacted.</span>
            </h2>
            <p>Track fan sentiment from YouTube comments within the 24 hours after the final whistle.</p>
          </div>
          
          <img class="hero-logo" src="assets/atmosfc-logo-v2.svg" alt="Atmos FC">
        </div>

        <form class="match-search-layout search-section search-form" action="results.html" method="get" autocomplete="off" data-search-form>
          <div class="search-bar">
            <label class="section-heading search-label">
              Search by team or fixture
              <input class="search-input" name="q" type="search" placeholder="PSG, Barcelona, Man United vs Man City">
            </label>
            <button class="primary-button" type="submit">Search ↗</button>
          </div>

          <fieldset class="filter-section">
            <span class="search-field">Competition:</span>
            <div class="filter-tabs">
              <label class="filter-option"><input type="radio" name="competition" value="" checked><span>All</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="PL"><span><img class="filter-emblem" src="https://crests.football-data.org/PL.png" alt="" loading="lazy" onerror="this.remove()">PL</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="PD"><span><img class="filter-emblem" src="https://crests.football-data.org/PD.png" alt="" loading="lazy" onerror="this.remove()">La Liga</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="BL1"><span><img class="filter-emblem" src="https://crests.football-data.org/BL1.png" alt="" loading="lazy" onerror="this.remove()">Bundesliga</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="SA"><span><img class="filter-emblem" src="https://crests.football-data.org/SA.png" alt="" loading="lazy" onerror="this.remove()">Serie A</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="FL1"><span><img class="filter-emblem" src="https://crests.football-data.org/FL1.png" alt="" loading="lazy" onerror="this.remove()">Ligue 1</span></label>
              <label class="filter-option"><input type="radio" name="competition" value="CL"><span><img class="filter-emblem" src="https://crests.football-data.org/CL.png" alt="" loading="lazy" onerror="this.remove()">UCL</span></label>
              <label class="filter-option is-unavailable"><input type="radio" name="competition" value="EL" disabled><span>UEL</span></label>
              <label class="filter-option is-unavailable"><input type="radio" name="competition" value="UECL" disabled><span>UECL</span></label>
            </div>
          </fieldset>

          <fieldset class="filter-section">
            <span class="search-field">Season:</span>
            <div class="filter-tabs">
              <label class="filter-option"><input type="radio" name="season" value="" checked><span>All</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2025"><span>25/26</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2024"><span>24/25</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2023"><span>23/24</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2022"><span>22/23</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2021"><span>21/22</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2020"><span>20/21</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2019"><span>19/20</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2018"><span>18/19</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2017"><span>17/18</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2016"><span>16/17</span></label>
              <label class="filter-option"><input type="radio" name="season" value="2015"><span>15/16</span></label>
            </div>
          </fieldset>
        </form>
      </section>

      <section class="match-search-layout recent-section">
        <div class="section-head" data-recent-heading>
          Recent matches
        </div>
        <div class="match-grid" data-recent></div>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
